<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivek Pal | CCNA Stacked Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        :root {
            --bg: #080808;
            --card-black: #000000;
            --neon-blue: #00f2ff;
            --text-gray: #b0b0b0;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* --- Main Container --- */
        .module-stack {
            position: relative;
            width: 350px;
            height: 220px;
            cursor: pointer;
        }

        /* --- Background Layers (Syllabus & Full Form) --- */
        .layer {
            position: absolute;
            width: 94%;
            height: 120px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 242, 255, 0.2);
            border-radius: 15px 15px 0 0;
            left: 3%;
            bottom: 60px;
            z-index: 1;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.2);
            padding: 20px;
            box-sizing: border-box;
            opacity: 0;
        }

        /* Hover Effect: Layer Slides Up and Reveals Full Form */
        .module-stack:hover .layer {
            transform: translateY(-80px);
            opacity: 1;
        }

        .layer h4 {
            color: var(--neon-blue);
            margin: 0;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .layer p {
            font-size: 0.75rem;
            color: #ccc;
            margin: 5px 0 0 0;
            line-height: 1.4;
        }

        /* --- Front Card (Title & Progress) --- */
        .main-card {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 160px;
            background: var(--card-black);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            z-index: 10;
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
            transition: border-color 0.4s;
        }

        .module-stack:hover .main-card {
            border-color: var(--neon-blue);
        }

        .card-header h3 {
            margin: 0;
            font-size: 1.6rem;
            letter-spacing: 2px;
            color: #fff;
        }

        .card-stats {
            display: flex;
            gap: 15px;
            font-size: 0.75rem;
            color: var(--text-gray);
            margin-top: 8px;
        }

        .card-stats i { color: var(--neon-blue); margin-right: 5px; }

        /* --- Open Button (Customized) --- */
        .action-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .action-btn:hover {
            background: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.5);
        }
    </style>
</head>
<body>

    <div class="module-stack">
        <div class="layer">
            <h4>CCNA FULL FORM:</h4>
            <p>Cisco Certified Network Associate</p>
            <p style="font-size: 0.65rem; margin-top: 10px; opacity: 0.6;">
                <i class="fas fa-info-circle"></i> Focus: Routing, Switching & Security
            </p>
        </div>
        
        <div class="main-card">
            <div class="card-header">
                <h3>CCNA</h3>
                <div class="card-stats">
                    <span><i class="fas fa-tasks"></i> 12/24 Sections</span>
                    <span><i class="fas fa-chart-line"></i> 50% Done</span>
                </div>
            </div>
            <button class="action-btn">
                <i class="fas fa-external-link-alt"></i> Open Module
            </button>
        </div>
    </div>

</body>
</html>
